name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        version: "latest"

    - name: Install Project and Dev Dependencies
      run: |
        uv sync --extra dev

    - name: Run Ruff Linter Check
      run: |
        uv run ruff check .

    - name: Run Black Code Formatter Check
      run: |
        uv run black --check .

    - name: Run Static Type Check (mypy)
      run: |
        uv run mypy --ignore-missing-imports app domain infrastructure

    - name: Run Static Validation Tests
      run: |
        uv run pytest -v -k "not test_golden_regression_suite"